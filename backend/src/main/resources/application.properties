spring.application.name=aquasample-backend
server.port=8080

# Base de datos H2 guardada en archivo (persiste al reiniciar el servidor)
spring.datasource.url=jdbc:h2:file:./data/aquasample
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fotos de las muestras
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.fotos.directorio=uploads

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
